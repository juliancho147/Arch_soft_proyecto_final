apiVersion: apps/v1
kind: Deployment
metadata: { name: nodo-entrada, namespace: taq }
spec:
  replicas: 1
  selector: { matchLabels: { app: nodo-entrada } }
  template:
    metadata: { labels: { app: nodo-entrada, taq-metricas: "true" } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: nodo-entrada
          image: taq/plataforma:1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: TAQ_ROLE, value: "gateway" }
            - { name: JAVA_OPTS, value: "-Xmx256m -XX:+UseG1GC" }
            - { name: TAQ_REDIS_URL, value: "redis://redis:6379" }
            - { name: TAQ_BLOQUEO_URL, value: "http://bd-bloqueo:8080" }
            - { name: TAQ_RESERVA_URL, value: "http://nodo-reserva:8080" }
            - { name: TAQ_PASARELA_URL, value: "http://nodo-pasarela:8080" }
            - { name: TAQ_DB_URL, value: "jdbc:postgresql://postgres:5432/taq" }
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 10, periodSeconds: 3 }
          resources: { requests: { cpu: 400m, memory: 256Mi }, limits: { cpu: "2", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: nodo-entrada, namespace: taq, labels: { app: nodo-entrada } }
spec: { selector: { app: nodo-entrada }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: nodo-entrada-ext, namespace: taq }
spec: { type: NodePort, selector: { app: nodo-entrada }, ports: [{ port: 8080, nodePort: 30080 }] }
---
