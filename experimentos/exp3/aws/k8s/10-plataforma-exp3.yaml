apiVersion: apps/v1
kind: Deployment
metadata: { name: nodo-entrada, namespace: taq }
spec:
  replicas: 1
  selector: { matchLabels: { app: nodo-entrada } }
  template:
    metadata:
      labels: { app: nodo-entrada, taq-metricas: "true" }
    spec:
      nodeSelector: { rol: app, kubernetes.io/arch: arm64 }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: nodo-entrada } } }
      terminationGracePeriodSeconds: 20
      containers:
        - name: nodo-entrada
          image: 767397902469.dkr.ecr.us-east-1.amazonaws.com/taq-plataforma:1.1
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: TAQ_ROLE, value: "gateway" }
            - { name: JAVA_OPTS, value: "-Xmx320m -XX:+UseG1GC" }
            - { name: TAQ_REDIS_URL, value: "redis://redis:6379" }
            - { name: TAQ_BLOQUEO_URL, value: "http://bd-bloqueo:8080" }
            - { name: TAQ_RESERVA_URL, value: "http://nodo-reserva:8080" }
            - { name: TAQ_PASARELA_URL, value: "http://nodo-pasarela:8080" }
            - { name: TAQ_DB_URL, value: "jdbc:postgresql://postgres:5432/taq" }
            - { name: TAQ_DETECCION, value: "on" }
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 15, periodSeconds: 3 }
          resources: { requests: { cpu: 500m, memory: 384Mi }, limits: { cpu: "2", memory: 640Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: nodo-entrada, namespace: taq, labels: { app: nodo-entrada } }
spec: { selector: { app: nodo-entrada }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bd-bloqueo, namespace: taq }
spec:
  replicas: 1
  selector: { matchLabels: { app: bd-bloqueo } }
  template:
    metadata:
      labels: { app: bd-bloqueo, taq-metricas: "true" }
    spec:
      nodeSelector: { rol: sistema, kubernetes.io/arch: arm64 }
      terminationGracePeriodSeconds: 20
      containers:
        - name: bd-bloqueo
          image: 767397902469.dkr.ecr.us-east-1.amazonaws.com/taq-plataforma:1.1
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: TAQ_ROLE, value: "bloqueo" }
            - { name: JAVA_OPTS, value: "-Xmx256m -XX:+UseG1GC" }
            - { name: TAQ_REDIS_URL, value: "redis://redis:6379" }
            - { name: TAQ_BLOQUEO_URL, value: "http://bd-bloqueo:8080" }
            - { name: TAQ_RESERVA_URL, value: "http://nodo-reserva:8080" }
            - { name: TAQ_PASARELA_URL, value: "http://nodo-pasarela:8080" }
            - { name: TAQ_DB_URL, value: "jdbc:postgresql://postgres:5432/taq" }
            - { name: TAQ_DETECCION, value: "on" }
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 15, periodSeconds: 3 }
          resources: { requests: { cpu: 1000m, memory: 384Mi }, limits: { cpu: "2", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: bd-bloqueo, namespace: taq, labels: { app: bd-bloqueo } }
spec: { selector: { app: bd-bloqueo }, ports: [{ name: http, port: 8080, targetPort: http }] }
