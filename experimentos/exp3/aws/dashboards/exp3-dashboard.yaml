nta AS \\\"Cuenta\\\", actor_ip AS \\\"IP\\\", detalle->>'regla' AS \\\"Regla\\\", (detalle->>'solicitudes_en_ventana')::int AS \\\"Solicitudes en la ventana\\\", (ts_evidencia - ts_evento_detector) AS \\\"Detecci\\u00f3n (ms)\\\" FROM auditoria_seguridad WHERE tipo = 'ATAQUE_DETECTADO' AND $__timeFilter(ts) ORDER BY id DESC LIMIT 12\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\",\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"pgseg\"\n     }\n    }\n   ],\n   \"options\": {\n    \"cellHeight\": \"sm\"\n   }\n  },\n  {\n   \"id\": 15,\n   \"type\": \"row\",\n   \"title\": \"S-2  Recuperarse del ataque \\u2014 medida: p95 \\u2264 300 ms (desde la alerta hasta asientos liberados + \\u00f3rdenes canceladas + cuentas revocadas)\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 24,\n    \"w\": 24,\n    \"h\": 1\n   },\n   \"collapsed\": false\n  },\n  {\n   \"id\": 16,\n   \"type\": \"stat\",\n   \"title\": \"p95 de recuperaci\\u00f3n\",\n   \"description\": \"Verde = cumple S-2 (\\u2264 300 ms).\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 25,\n    \"w\": 3,\n    \"h\": 6\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prom\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\",\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"red\",\n        \"value\": 0.3\n       }\n      ]\n     },\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"decimals\": 4\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"histogram_quantile(0.95, sum(rate(taq_recuperacion_seconds_bucket[5m])) by (le))\",\n     \"instant\": true,\n     \"refId\": \"A\",\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prom\"\n     }\n    }\n   ]