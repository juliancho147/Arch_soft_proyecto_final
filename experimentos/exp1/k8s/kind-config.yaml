kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 30080 }   # gateway (JMeter)
      - { containerPort: 30090, hostPort: 30090 }   # bd_bloqueo (verificador)
      - { containerPort: 30432, hostPort: 30432 }   # PostgreSQL (verificador)
      - { containerPort: 30900, hostPort: 30900 }   # Prometheus
      - { containerPort: 30300, hostPort: 30300 }   # Grafana
