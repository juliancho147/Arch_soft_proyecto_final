apiVersion: v1
kind: ConfigMap
metadata: { name: prom-config, namespace: taq }
data:
  prometheus.yml: |
    global: { scrape_interval: 5s, evaluation_interval: 5s }
    scrape_configs:
      - job_name: taq
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["nodo-entrada:8080", "nodo-reserva:8080", "bd-bloqueo:8080", "nodo-pasarela:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: taq }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--web.enable-lifecycle"]
          ports: [{ containerPort: 9090 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          volumeMounts: [{ name: cfg, mountPath: /etc/prometheus }]
      volumes: [{ name: cfg, configMap: { name: prom-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: taq }
spec: { type: NodePort, selector: { app: prometheus }, ports: [{ port: 9090, nodePort: 30900 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-prov, namespace: taq }
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, type: prometheus, uid: prom, access: proxy, url: "http://prometheus:9090", isDefault: true }
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - { name: exp, type: file, options: { path: /var/lib/grafana/dashboards } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: taq }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
          ports: [{ containerPort: 3000 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 384Mi } }
          volumeMounts:
            - { name: prov-ds, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml }
            - { name: prov-ds, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dash, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: prov-ds, configMap: { name: grafana-prov } }
        - { name: dash, configMap: { name: grafana-dash } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: taq }
spec: { type: NodePort, selector: { app: grafana }, ports: [{ port: 3000, nodePort: 30300 }] }
